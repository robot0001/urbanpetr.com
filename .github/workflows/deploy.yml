name: Prod Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

env:
  AWS_REGION: "eu-central-1"
  S3_BUCKET_NAME: "urbanpetr-website"

# Cancel superseded PR runs, but never interrupt a push: cancelling mid
# `terraform apply` would leave prod state locked.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-v0.50.3-${{ hashFiles('terraform/**/.tflint.hcl') }}

      - name: tflint init
        working-directory: terraform
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: tflint
        working-directory: terraform
        run: tflint --recursive

  typecheck:
    name: Typecheck (web + admin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web
        run: npx nuxt typecheck

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Typecheck admin
        working-directory: admin
        run: npx nuxt typecheck

  terraform_plan_pr:
    name: Terraform plan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        include:
          - name: prod
            dir: terraform/envs/prod
            plan_args: '-var-file="prod.tfvars"'
          - name: admin
            dir: terraform/envs/admin
            plan_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Git Credentials
        run: |
          echo "https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com" > ~/.git-credentials
          git config --global credential.helper store

      - name: Point Terraform at a plugin cache
        run: |
          mkdir -p "$HOME/.cache/terraform-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.cache/terraform-plugins" >> "$GITHUB_ENV"

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.cache/terraform-plugins
          key: ${{ runner.os }}-tf-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugins-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ matrix.dir }}
        run: terraform plan ${{ matrix.plan_args }} -input=false -no-color

  terraform_apply:
    name: Terraform apply (prod + admin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    outputs:
      web_cloudfront_distribution_id: ${{ steps.tf_web.outputs.distribution_id }}
      admin_s3_bucket_name: ${{ steps.tf_admin.outputs.s3_bucket_name }}
      admin_cloudfront_distribution_id: ${{ steps.tf_admin.outputs.cloudfront_distribution_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Git Credentials
        run: |
          echo "https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com" > ~/.git-credentials
          git config --global credential.helper store

      - name: Point Terraform at a plugin cache
        run: |
          mkdir -p "$HOME/.cache/terraform-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.cache/terraform-plugins" >> "$GITHUB_ENV"

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.cache/terraform-plugins
          key: ${{ runner.os }}-tf-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tf-plugins-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform init (prod)
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      - name: Terraform apply (prod)
        working-directory: terraform/envs/prod
        env:
          TF_VAR_s3_bucket_name: ${{ env.S3_BUCKET_NAME }}
        run: terraform apply -var-file="prod.tfvars" -auto-approve -input=false

      - name: Capture prod outputs
        id: tf_web
        working-directory: terraform/envs/prod
        run: echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Terraform init (admin)
        working-directory: terraform/envs/admin
        run: terraform init -input=false

      - name: Terraform apply (admin)
        working-directory: terraform/envs/admin
        run: terraform apply -auto-approve -input=false

      - name: Capture admin outputs
        id: tf_admin
        working-directory: terraform/envs/admin
        run: |
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

  # Web and admin are split into independent jobs (rather than one serial
  # job) — both only need terraform_apply's outputs, and neither depends on
  # the other's build or deploy.

  sync_web:
    name: Build and sync (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: terraform_apply
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Generate web static site
        run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: https://api.urbanpetr.com
          NUXT_PUBLIC_GTAG_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync web to S3
        run: |
          aws s3 sync .output/public/ s3://${{ env.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "max-age=300"

      - name: Invalidate web CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform_apply.outputs.web_cloudfront_distribution_id }} \
            --paths "/*"

  sync_admin:
    name: Build and sync (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: terraform_apply
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Generate admin static site
        working-directory: admin
        run: npm run generate
        env:
          NUXT_PUBLIC_API_BASE: https://api.urbanpetr.com
          NUXT_PUBLIC_COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          NUXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync admin to S3
        run: |
          aws s3 sync admin/.output/public/ s3://${{ needs.terraform_apply.outputs.admin_s3_bucket_name }} \
            --delete \
            --cache-control "max-age=300"

      - name: Invalidate admin CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.terraform_apply.outputs.admin_cloudfront_distribution_id }} \
            --paths "/*"
