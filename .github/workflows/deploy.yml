name: Prod Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: "eu-central-1"
  S3_BUCKET_NAME: "urbanpetr-website"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform_plan_pr:
    name: Terraform plan for prod env
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Git Credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      - name: Terraform fmt
        working-directory: terraform/envs/prod
        run: terraform fmt -check

      - name: Terraform validate
        working-directory: terraform/envs/prod
        run: terraform validate

      - name: Terraform plan (PR)
        working-directory: terraform/envs/prod
        run: terraform plan -var-file="prod.tfvars" -input=false -no-color

  terraform_apply_main:
    name: Terraform apply to prod env
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure Git Credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      - name: Terraform apply (main)
        working-directory: terraform/envs/prod
        env:
          TF_VAR_s3_bucket_name: ${{ env.S3_BUCKET_NAME }}
        run: terraform apply -var-file="prod.tfvars" -auto-approve -input=false

  sync_static:
    name: Sync static files to S3
    runs-on: ubuntu-latest
    needs: terraform_apply_main
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync .output/public/ s3://${{ env.S3_BUCKET_NAME }} \
            --delete \
            --cache-control "max-age=300"
