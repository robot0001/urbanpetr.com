name: PR Stage Env Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_PREFIX: ${{ secrets.S3_BUCKET_PREFIX }}
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}

jobs:
  stage_plan_apply:
    # Spustit pokud NENI zavřeno A ZAROVEN má label 'stage'
    if: >
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    environment:
      name: stage-pr-${{ github.event.number }}
      url: https://stage${{ github.event.number }}.${{ env.DOMAIN_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Přidáno: Nutné pro stažení privátních modulů (stejné jako v Prod)
      - name: Configure Git Credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 # Updatováno na v4 pro konzistenci
        with:
          # Zde pozor: V Prod používáte keys, tady role. Pokud role funguje, nechte ji.
          # Pokud ne, zvažte sjednocení s Prod (keys).
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} 
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ZMĚNA: working-directory nastaveno tam, kde jsou .tf soubory
      - name: Terraform init
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      # ZMĚNA: working-directory
      - name: Select/create workspace for this PR
        working-directory: terraform/envs/prod
        run: |
          terraform workspace select stage-pr-${{ github.event.number }} \
            || terraform workspace new stage-pr-${{ github.event.number }}

      # ZMĚNA: working-directory a cesta k var-file
      - name: Terraform plan (stage)
        working-directory: terraform/envs/prod
        run: |
          terraform plan \
            -var-file="prod.tfvars" \
            -var="environment=stage" \
            -var="stage_pr_number=${{ github.event.number }}" \
            -var="stage_subdomain=stage${{ github.event.number }}" \
            -var="s3_bucket_name=${{ env.S3_BUCKET_PREFIX }}${{ github.event.number }}" \
            -input=false -no-color

      # ZMĚNA: working-directory a cesta k var-file
      - name: Terraform apply (stage)
        working-directory: terraform/envs/prod
        run: |
          terraform apply \
            -var-file="prod.tfvars" \
            -var="environment=stage" \
            -var="stage_pr_number=${{ github.event.number }}" \
            -var="stage_subdomain=stage${{ github.event.number }}" \
            -var="s3_bucket_name=${{ env.S3_BUCKET_PREFIX }}${{ github.event.number }}" \
            -auto-approve -input=false

      - name: Sync static to stage bucket
        run: |
          aws s3 sync src/ s3://${{ env.S3_BUCKET_PREFIX }}${{ github.event.number }} \
            --delete \
            --cache-control "max-age=60"

  stage_destroy:
    if: >
      github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'stage')
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Přidáno: I pro destroy je potřeba init, a pro init je potřeba git auth
      - name: Configure Git Credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.GLOBAL_MODULES_PAT }}@github.com".insteadOf "https://github.com"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # ZMĚNA: working-directory
      - name: Terraform init
        working-directory: terraform/envs/prod
        run: terraform init -input=false

      # ZMĚNA: working-directory
      - name: Select workspace if it exists
        id: select_ws
        working-directory: terraform/envs/prod
        run: |
          if terraform workspace list | grep -q "stage-pr-${{ github.event.number }}"; then
            terraform workspace select stage-pr-${{ github.event.number }}
          else
            echo "no_workspace=true" >> "$GITHUB_OUTPUT"
          fi

      # ZMĚNA: working-directory a cesta k var-file
      - name: Terraform destroy (stage)
        if: steps.select_ws.outputs.no_workspace != 'true'
        working-directory: terraform/envs/prod
        run: |
          terraform destroy \
            -var-file="prod.tfvars" \
            -var="environment=stage" \
            -var="stage_pr_number=${{ github.event.number }}" \
            -var="stage_subdomain=stage${{ github.event.number }}" \
            -var="s3_bucket_name=${{ env.S3_BUCKET_PREFIX }}${{ github.event.number }}" \
            -auto-approve -input=false

      # ZMĚNA: working-directory
      - name: Delete workspace
        if: steps.select_ws.outputs.no_workspace != 'true'
        working-directory: terraform/envs/prod
        run: |
          terraform workspace select default
          terraform workspace delete -force stage-pr-${{ github.event.number }}